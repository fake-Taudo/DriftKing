# Render-Blueprint für DRIFTKÖNIG (Web Service mit HTTP + WebSocket auf einem Port).
# Anleitung: docs/DEPLOY_RENDER.md
# Hinweis: Kostenlose Instanzen schlafen nach ca. 15 Minuten ohne Anfragen ein; der erste Aufruf
# danach dauert bis zu etwa einer Minute (Kaltstart).
services:
  - type: web
    name: driftkoenig
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
